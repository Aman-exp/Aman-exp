    .seg {
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
      opacity: 0;
      animation: fade-in 0.5s ease-out forwards;
    }
    @keyframes fade-in { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
